name: Daily post

on:
  schedule:
    - cron: "0 21 * * *"   # 14:00 UTC every day; change to taste
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py

      - name: Commit image so it has a public URL
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add output history.json
          git commit -m "Generate $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Post to Instagram
        run: python post.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output

      - name: Record that it was posted
        run: |
          git add history.json
          git commit -m "Mark posted $(date -u +%F)" || echo "nothing to commit"
          git push
