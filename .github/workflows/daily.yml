name: Daily post

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC every day; change to taste
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py

      - name: Publish images to the throwaway images branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          KEEP_DAYS: "7"
        run: bash publish_images.sh

      - name: Commit history
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add history.json
          git commit -m "Generate $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Post to Instagram
        run: python post.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/images

      - name: Record that it was posted
        run: |
          git add history.json
          git commit -m "Mark posted $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily.yml
